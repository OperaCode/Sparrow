name: Bug report
description: Something is broken or behaving incorrectly.
title: 'fix(<scope>): '
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - Backend / API
        - Operations dashboard
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and app version
      placeholder: e.g. Tecno Spark 10, Android 13, preview build 1.0.0
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove any phone numbers, addresses, PINs or other personal data first.
