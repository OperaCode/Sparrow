name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Backend lint, typecheck, migrations, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sparrow
          POSTGRES_PASSWORD: sparrow
          POSTGRES_DB: sparrow_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparrow -d sparrow_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      # Disposable CI-only values; nothing here is a real secret.
      DATABASE_URL: postgresql://sparrow:sparrow@localhost:5432/sparrow_ci_test
      TEST_DATABASE_URL: postgresql://sparrow:sparrow@localhost:5432/sparrow_ci_test
      JWT_ACCESS_SECRET: ci-only-signing-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and generate Prisma client
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The service database starts empty, so this proves the full migration
      # history applies from scratch.
      - name: Apply migrations to an empty database
        run: npm run db:migrate

      - name: Check the schema matches the migrations
        run: npm run db:check-drift

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
